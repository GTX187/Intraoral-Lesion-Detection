[TRAINING]
epochs           = 15
batch_size       = 16
# Same encoder/head LR-split rationale as the UNet pipeline: pretrained
# backbone fine-tunes slowly, randomly-initialised classification head
# learns faster.
backbone_lr      = 0.0001
head_lr          = 0.001
momentum         = 0.9
weight_decay     = 0.0005
gradient_clip    = 1.0
val_split        = 0.15
test_split       = 0.15
# Loss function: ce | weighted_ce | focal
# OPMD is the rarest class by a wide margin (see EDA), so plain CE is not
# a good default here — focal is.
loss_function    = focal
focal_gamma      = 2.0
lr_scheduler     = cosine
min_lr           = 0.000025
lr_patience      = 5
lr_factor        = 0.5
num_workers      = 2
log_every        = 10
val_every        = 1

[MODEL]
backbone    = resnet34
# Any torchvision ResNet: resnet18 | resnet34 | resnet50 | resnet101
pretrained  = True
num_classes = 3
# Fixed order — index 0/1/2 map onto Normal / Variation / OPMD.
# See CLASS_LABEL_MAP in resnet_builder.py — do not reorder without
# retraining, since a saved checkpoint's fc layer is order-dependent.

[SYSTEM]
device = cuda
seed   = 42

[LOGGING]
save_best_model = True

[PATHS]
model_dir        = /kaggle/working/intraoral_lesion/outputs/resnet_cls/models
output_dir       = /kaggle/working/intraoral_lesion/outputs/resnet_cls/cls_training
checkpoint_dir   = /kaggle/working/intraoral_lesion/outputs/resnet_cls/checkpoint

[DATASET]
image_size = 512