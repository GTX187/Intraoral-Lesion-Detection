[loggers]
keys=root

[handlers]
keys=customSizeDayRotatingFileHandler,consoleHandler

[formatters]
keys=standard

[logger_root]
level=DEBUG
handlers=customSizeDayRotatingFileHandler,consoleHandler

[handler_customSizeDayRotatingFileHandler]
class=utils.log_handler.CustomSizeDayRotatingFileHandler
level=DEBUG
formatter=standard
args=('./logs/intraoral_lesion.log', 'midnight', 5, 4)

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=standard
args=(sys.stdout,)

[formatter_standard]
format=%(asctime)s - %(name)s - %(levelname)s - %(transaction_id)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S